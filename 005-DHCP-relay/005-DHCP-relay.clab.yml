name: 005-DHCP-relay

mgmt:
  network: clab
  ipv4-subnet: 172.20.20.0/24

topology:
  nodes:
    Cisco-R1:
      kind: cisco_iol
      image: vrnetlab/cisco_iol:17.18.2
      mgmt-ipv4: 172.20.20.11
    Mikrotik-R1:
      kind: mikrotik_ros
      image: vrnetlab/mikrotik_routeros:7.22.1
      mgmt-ipv4: 172.20.20.12
    Cisco-SW1:
      kind: cisco_iol
      image: vrnetlab/cisco_iol:L2-17.18.2
      type: l2
      mgmt-ipv4: 172.20.20.13
    Cisco-SW2:
      kind: cisco_iol
      image: vrnetlab/cisco_iol:L2-17.18.2
      type: l2
      mgmt-ipv4: 172.20.20.14
    pc1:
      kind: linux
      image: alpine:latest
    pc2:
      kind: linux
      image: alpine:latest
    pc3:
      kind: linux
      image: alpine:latest

  links:
    - endpoints: ["Cisco-R1:e0/1", "Mikrotik-R1:eth2"]
    - endpoints: ["Cisco-R1:e0/2", "Cisco-SW1:e0/1"]
    - endpoints: ["Mikrotik-R1:eth3", "Cisco-SW2:e0/1"]
    - endpoints: ["Cisco-SW1:e0/2", "pc1:ether1"]
    - endpoints: ["Cisco-SW2:e0/2", "pc2:ether1"]
    - endpoints: ["Cisco-SW2:e0/3", "pc3:ether1"]
