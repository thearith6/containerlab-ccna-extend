name: 001-VLAN-Modes

mgmt:
  network: clab
  ipv4-subnet: 172.20.20.0/24

topology:
  nodes:
    SW1:
      kind: cisco_iol
      image: vrnetlab/cisco_iol:L2-17.18.2
      type: l2
      mgmt-ipv4: 172.20.20.11
    SW2:
      kind: cisco_iol
      image: vrnetlab/cisco_iol:L2-17.18.2
      type: l2
      mgmt-ipv4:  172.20.20.12
    pc1:
      kind: linux
      image: alpine:latest
    pc2:
      kind: linux
      image: alpine:latest
    pc3:
      kind: linux
      image: alpine:latest
    pc4:
      kind: linux
      image: alpine:latest
  links:
    - endpoints: ["SW1:e0/2", "pc1:eth1"]
    - endpoints: ["SW1:e0/3", "pc2:eth1"]
    - endpoints: ["SW1:e0/1", "SW2:e0/1"]
    - endpoints: ["SW2:e0/2", "pc3:eth1"]
    - endpoints: ["SW2:e0/3", "pc4:eth1"]
