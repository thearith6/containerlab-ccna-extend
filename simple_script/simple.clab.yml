name: simple

topology:
  nodes:
    r1:
      kind: cisco_iol
      image: vrnetlab/cisco_iol:17.18.2
    r2:
      kind: cisco_iol
      image: vrnetlab/cisco_iol:17.18.2

    pc1:
      kind: linux
      image: alpine:latest
    pc2:
      kind: linux
      image: alpine:latest
  links:
    - endpoints: ["pc1:eth1","r1:Ethernet0/1"]
    - endpoints: ["pc2:eth1","r2:Ethernet0/1"]
    - endpoints: ["r1:Ethernet0/2","r2:Ethernet0/2"]